name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      # --- client ---
      - name: Use pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install client dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Audit client dependencies
        working-directory: client
        run: pnpm audit --prod --audit-level=high

      - name: Run client lint
        working-directory: client
        run: pnpm run lint

      - name: Run client tests
        working-directory: client
        run: pnpm run test

      - name: Build client
        working-directory: client
        run: pnpm run build

      # --- server ---
      - name: Use Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
          cache-dependency-path: server/go.sum
          cache: true

      - name: Run server tests
        working-directory: server
        env:
          TEST_DB_USER: root
          TEST_DB_PASSWORD: root
        run: go test ./...

      - name: Build server
        working-directory: server
        run: go build ./...

      - name: Scan server dependencies for known vulnerabilities
        working-directory: server
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Scan desktop shell dependencies for known vulnerabilities
        working-directory: client/src-tauri
        run: cargo audit
